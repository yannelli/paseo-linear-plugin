<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Linear issues for Paseo graphics</title>
<link rel="stylesheet" href="scene.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 40 32">
    <circle class="ring" cx="13" cy="16" r="9.6"/>
    <circle class="core" cx="13" cy="16" r="3.6"/>
    <path class="arrow" d="M27 9.5 33.5 16 27 22.5"/>
  </symbol>
  <!-- Line icons drawn after Lucide (ISC license), the icon set Paseo uses. -->
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-arrow-up-down" viewBox="0 0 24 24"><path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16"/></symbol>
  <symbol id="i-list-tree" viewBox="0 0 24 24"><path d="M21 12h-8M21 6H8M21 18h-8M3 6v4c0 1.1.9 2 2 2h3M3 10v6c0 1.1.9 2 2 2h3"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></symbol>
  <symbol id="i-circle-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-circle-user" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.66V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.66"/></symbol>
  <symbol id="i-signal-high" viewBox="0 0 24 24"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8"/></symbol>
  <symbol id="i-signal-medium" viewBox="0 0 24 24"><path d="M2 20h.01M7 20v-4M12 20v-8"/></symbol>
  <symbol id="i-signal-low" viewBox="0 0 24 24"><path d="M2 20h.01M7 20v-4"/></symbol>
  <symbol id="i-triangle-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"/></symbol>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-refresh-cw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5"/></symbol>
  <symbol id="i-git-branch" viewBox="0 0 24 24"><path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></symbol>
  <symbol id="i-external-link" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3v18l14-9Z"/></symbol>
  <symbol id="i-scan-search" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/></symbol>

</svg>

<script>
// Sample data only. Identifiers, people, and projects are invented.
const STATES = {
  progress: { name: 'In Progress', icon: 'circle-dot', color: '#f2c94c' },
  todo: { name: 'Todo', icon: 'circle', color: '#e2e2e2' },
};
const PRIORITIES = { 0: 'minus', 1: 'triangle-alert', 2: 'signal-high', 3: 'signal-medium', 4: 'signal-low' };
const ISSUE_ROWS = [
  { header: 'progress', count: 2 },
  { id: 'ENG-131', title: 'Speed up dashboard queries', state: 'progress', priority: 1, who: 'Tom Chen', ago: '3h ago', kids: 2, collapsed: true },
  { id: 'ENG-120', title: 'Redesign the reports page', state: 'progress', priority: 2, who: 'Maya Ali', ago: '1h ago', kids: 2 },
  { id: 'ENG-123', title: 'Add CSV export to the reports page', state: 'todo', priority: 2, who: 'Sam Park', ago: '2h ago', depth: 1, selected: true },
  { id: 'ENG-124', title: 'Add a date range filter', state: 'progress', priority: 3, who: 'Lea Kim', ago: '1d ago', depth: 1 },
  { header: 'todo', count: 3 },
  { id: 'ENG-118', title: 'Fix the login redirect loop', state: 'todo', priority: 2, who: null, ago: '5h ago' },
  { id: 'ENG-127', title: 'Update the onboarding emails', state: 'todo', priority: 3, who: 'Priya Shah', ago: '2d ago' },
  { id: 'ENG-129', title: 'Remove the old billing API', state: 'todo', priority: 4, who: 'Tom Chen', ago: '4d ago' },
];
const ISSUE_TITLE = 'Add CSV export to the reports page';
// The first lines of the built-in Implement template (shared/prompts.ts) for ENG-123.
const PROMPT_LINES = [
  `You are working on Linear issue ENG-123: ${ISSUE_TITLE}`,
  '',
  `Linear issue ENG-123: ${ISSUE_TITLE}`,
  'URL: https://linear.app/acme/issue/ENG-123',
  'Team: Engineering',
  'Status: Todo',
  'Priority: High',
];

const ic = (name, cls = '') => `<svg class="i${cls ? ` ${cls}` : ''}"><use href="#i-${name}"/></svg>`;
const button = (label, icon, variant = '') => `<span class="btn ${variant}">${icon ? ic(icon) : ''}${label}</span>`;
const iconButton = (icon) => `<span class="icon-btn">${ic(icon)}</span>`;

function stateIcon(key) {
  const state = STATES[key];
  return `<svg class="i" style="color:${state.color}"><use href="#i-${state.icon}"/></svg>`;
}

function priorityIcon(priority) {
  return ic(PRIORITIES[priority], priority === 1 ? 'urgent' : 'muted');
}

function avatar(name) {
  if (!name) return ic('circle-user', 'avatar-empty');
  const letters = name.split(' ').map((part) => part[0]).join('').slice(0, 2);
  return `<span class="avatar">${letters}</span>`;
}

function segmented(options, selected) {
  return `<div class="seg">${options.map((option) => `<span class="${option === selected ? 'on' : ''}">${option}</span>`).join('')}</div>`;
}

function issueRow(issue) {
  const chevron = issue.kids ? ic(issue.collapsed ? 'chevron-right' : 'chevron-down') : '';
  const hidden = issue.collapsed ? `<div class="meta">${issue.kids} sub-issues hidden</div>` : '';
  return `<div class="issue${issue.selected ? ' selected' : ''}" style="padding-left:${10 + (issue.depth ?? 0) * 18}px">
    <span class="chev">${chevron}</span>${priorityIcon(issue.priority)}${stateIcon(issue.state)}
    <div class="body"><div class="title">${issue.title}</div><div class="meta">${issue.id} · ${issue.ago}</div>${hidden}</div>
    ${avatar(issue.who)}
  </div>`;
}

function groupHeader(row) {
  return `<div class="group">${stateIcon(row.header)}${STATES[row.header].name}<small>${row.count}</small></div>`;
}

function listPane() {
  return `<div class="list-pane">
    <div class="filters">
      <div class="hrow"><div class="search">${ic('search')}Search issues or jump to ENG-123</div>${button('New', 'plus', 'primary')}</div>
      <div class="hrow">${segmented(['Mine', 'Everyone', 'Unassigned'], 'Everyone')}${segmented(['Active', 'Backlog', 'Done', 'All'], 'Active')}</div>
      <div class="hrow">${button('Engineering', 'users', 'ghost xs')}${button('Priority', 'arrow-up-down', 'ghost xs')}${button('Sub-issues', 'list-tree', 'xs')}</div>
    </div>
    <div class="issues">${ISSUE_ROWS.map((row) => (row.header ? groupHeader(row) : issueRow(row))).join('')}</div>
  </div>`;
}

const prop = (leading, label) => `<span class="prop">${leading}${label}${ic('chevron-down', 'down')}</span>`;
const label = (name, color) => `<span class="label"><i style="background:${color}"></i>${name}</span>`;

function detailPane() {
  return `<div class="detail-pane">
    <div class="bar">${iconButton('x')}
      <div class="crumbs">Engineering<span>›</span><u>ENG-120</u><span>›</span><b>ENG-123</b></div>
      ${iconButton('refresh-cw')}${iconButton('git-branch')}${iconButton('external-link')}
    </div>
    <div class="detail">
      <div class="issue-title">${ISSUE_TITLE}</div>
      <div class="props">${prop(stateIcon('todo'), 'Todo')}${prop(priorityIcon(2), 'High')}${prop(avatar('Sam Park'), 'Sam Park')}<span class="project">${ic('folder-git-2')}Acme Web</span></div>
      <div class="labels">${label('Feature', '#bb87fc')}${label('Reports', '#4ea7fc')}</div>
      <div class="hrow">${button('Start agent', 'play', 'primary md')}${button('Start review', 'scan-search', 'md')}</div>
      <div>
        <div class="section-label">Description</div>
        <div class="markdown">
          <p>Users want to download the data behind a report.</p>
          <h3>Requirements</h3>
          <ul>
            <li><span>Add an <b>Export CSV</b> button to the report header.</span></li>
            <li><span>Use the active filters, such as <code>dateRange</code>.</span></li>
            <li><span>Name the file <code>report-2026-10-07.csv</code>.</span></li>
          </ul>
        </div>
      </div>
    </div>
  </div>`;
}

function browseWindow() {
  return `<div class="window block">
    <div class="titlebar">${ic('square-kanban')}<b>Linear</b></div>
    <div class="split">${listPane()}${detailPane()}</div>
  </div>`;
}

const chip = (name, value) => `<span class="chip"><small>${name}</small>${value}${ic('chevron-down')}</span>`;
const toggle = (text) => `<div class="toggle"><span>${text}</span><i class="switch"></i></div>`;

function field(icon, name, value, detail) {
  const small = detail ? `<small>${detail}</small>` : '';
  return `<div class="field">${ic(icon)}<span class="name">${name}</span><div class="value">${value}${small}</div>${ic('chevron-down', 'down')}</div>`;
}

function launchWindow() {
  const prompt = PROMPT_LINES.map((line) => line || ' ').join('\n');
  return `<div class="window block">
    <div class="bar">${iconButton('chevron-left')}<div class="heading">Start agent · ENG-123</div></div>
    <div class="launch">
      <div class="issue-name">${ISSUE_TITLE}</div>
      <div class="prompt-box">
        <div class="prompt">${prompt}<span class="thumb"></span></div>
        <div class="chip-row">${chip('Prompt', 'Implement')}${chip('Agent', 'Claude Code')}${chip('Model', 'Opus')}${chip('Effort', 'High')}</div>
      </div>
      <div class="hint">The prompt follows the options below until you edit it.</div>
      <div class="stack">
        <div class="section-label">Where</div>
        ${field('folder-git-2', 'Project', 'Acme Web')}
        ${field('git-branch', 'Run in', 'New worktree', 'sam/eng-123-add-csv-export-to-the-reports-page')}
      </div>
      <div class="stack">
        <div class="section-label">Options</div>
        ${toggle('Include comments in the prompt')}${toggle('Move the issue to In Progress')}${toggle('Assign the issue to me')}
      </div>
      <div class="start">${button('Start agent', 'play', 'primary md')}</div>
    </div>
  </div>`;
}

function settingsRow(title, hint, control = '', inline = false) {
  const small = hint ? `<small>${hint}</small>` : '';
  const right = control ? `<div class="s-control${inline ? ' inline' : ''}">${control}</div>` : '';
  return `<div class="s-row"><div class="s-label"><b>${title}</b>${small}</div>${right}</div>`;
}

const settingsSection = (title, rows) => `<section><div class="s-title">${title}</div><div class="s-card">${rows}</div></section>`;
const keyInput = '<div class="input">lin_api_...</div>';

function settingsWindow() {
  const account = settingsRow('Status', 'Using the key from the daemon environment (…a1b2)', '<span class="muted">Alex Rivera · Acme</span>', true);
  const defaultKey = settingsRow(
    'Personal API key',
    'Saved on the daemon host with owner-only permissions. A saved key takes precedence over the daemon environment.',
    `<span class="link">Create a key in Linear${ic('external-link')}</span>${keyInput}${button('Connect Linear', 'key-round', 'primary md')}`,
  );
  const projectKeys = [
    settingsRow('Use a different Linear key for a project', 'Workspaces in the project use its key. Other projects use the default key above.'),
    settingsRow('Acme Mobile', 'Key …9f3c', button('Remove', '', 'outline'), true),
    settingsRow('Project', '', `<span class="select">Client Portal${ic('chevron-down')}</span>`, true),
    settingsRow('Project API key', "Replaces the project's key if it has one.", `${keyInput}${button('Save project key', 'key-round', 'primary md')}`),
  ].join('');
  return `<div class="window block">
    <div class="titlebar">Settings<i>›</i>Plugins<i>›</i>Linear<i>›</i><b>Account</b></div>
    <div class="settings">
      ${settingsSection('Linear account', account)}
      ${settingsSection('Replace the default key', defaultKey)}
      ${settingsSection('Project keys', projectKeys)}
    </div>
  </div>`;
}

function featurePage(title, sub, windowHtml) {
  return `<div class="page"><h1 class="block">${title}</h1><p class="sub block">${sub}</p>${windowHtml}</div>`;
}

const SCENES = {
  social: { width: 1280, height: 640, html: () => `<div class="social" style="height:100%">
    <div class="social-text">
      <h1 class="block">Linear issues<br>in Paseo</h1>
      <ul class="facts block"><li>Browse, edit, and create issues</li><li>Start an agent from an issue</li><li>Use a different Linear key per project</li></ul>
      <div class="install mono block"><span>paseo plugin add</span> npm:@yannelli/paseo-linear-plugin</div>
    </div>
    <div class="window block">${detailPane()}</div>
  </div>` },
  browse: { width: 960, height: 768, html: () => featurePage(
    'Browse Linear issues in Paseo',
    'Search, filter, and sort issues. Sub-issues nest under their parent.',
    browseWindow(),
  ) },
  launch: { width: 960, height: 920, html: () => featurePage(
    'Start an agent from a Linear issue',
    'Choose the prompt, agent, model, effort, and where the agent runs.',
    launchWindow(),
  ) },
  keys: { width: 960, height: 940, html: () => featurePage(
    'Use a different Linear key per project',
    'Keys stay on the daemon host. The daemon never sends them to the app.',
    settingsWindow(),
  ) },
  icon: { width: 256, height: 256, transparent: true, html: () =>
    '<div class="icon-tile"><svg class="mark" viewBox="0 0 40 32"><use href="#mark"/></svg></div>' },
};

function describe(node) {
  const name = `${node.tagName.toLowerCase()}${[...node.classList].map((c) => `.${c}`).join('')}`;
  return `${name} "${node.textContent.trim().replace(/\s+/g, ' ').slice(0, 40)}"`;
}

// Reports blocks outside the frame, blocks that overlap, and boxes whose content is cut off or spills out.
function layoutProblems(width, height) {
  const problems = [];
  const blocks = [...document.querySelectorAll('.block')].map((node) => [node, node.getBoundingClientRect()]);
  for (const [node, r] of blocks) {
    if (r.left < 0 || r.top < 0 || r.right > width || r.bottom > height) problems.push(`${describe(node)} leaves the frame`);
  }
  blocks.forEach(([a, ra], index) => blocks.slice(index + 1).forEach(([b, rb]) => {
    if (ra.left < rb.right && rb.left < ra.right && ra.top < rb.bottom && rb.top < ra.bottom) {
      problems.push(`${describe(a)} overlaps ${describe(b)}`);
    }
  }));
  for (const node of document.querySelectorAll('main, main *')) {
    if (node instanceof SVGElement) continue;
    const display = getComputedStyle(node).display;
    if (display === 'inline' || display === 'contents') continue;
    if (node.scrollWidth > node.clientWidth + 1 || node.scrollHeight > node.clientHeight + 1) {
      const size = `${node.scrollWidth}x${node.scrollHeight} in ${node.clientWidth}x${node.clientHeight}`;
      problems.push(`${describe(node)} cuts off or spills its content (${size})`);
    }
  }
  return problems;
}

const FONTS = ['Instrument Sans', 'JetBrains Mono'];

window.renderScene = async (name) => {
  const scene = SCENES[name];
  if (!scene) throw new Error(`Unknown scene: ${name}`);
  Object.assign(document.body.style, { width: `${scene.width}px`, height: `${scene.height}px` });
  if (scene.transparent) document.body.style.background = 'transparent';
  const main = document.createElement('main');
  main.innerHTML = scene.html();
  document.body.append(main);
  await Promise.all(FONTS.map((family) => document.fonts.load(`16px "${family}"`)));
  await document.fonts.ready;
  const fonts = FONTS.every((family) => document.fonts.check(`16px "${family}"`));
  return { width: scene.width, height: scene.height, fonts, problems: layoutProblems(scene.width, scene.height) };
};
</script>
